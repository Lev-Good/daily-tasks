name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage installer payload
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'payload'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $files = @(
            'DailyTasks.cmd',
            'DailyTasks.ps1',
            'DailyTasks.exe',
            'DailyTasks.ico',
            'install.cmd',
            'uninstall.cmd',
            'uninstall.ps1',
            'README.txt',
            'setup.ps1',
            'sound.wav',
            'success.wav'
          )
          foreach ($f in $files) {
            Copy-Item -LiteralPath $f -Destination $staging -Force
          }
          # Build sources: launcher + manifest + installer
          Copy-Item -LiteralPath 'Launcher.cs' -Destination $staging -Force
          Copy-Item -LiteralPath 'app.manifest' -Destination $staging -Force
          Copy-Item -LiteralPath 'DailyTasks-Setup/SFX.cs' -Destination $staging -Force
          Copy-Item -LiteralPath 'DailyTasks-Setup/build_setup.ps1' -Destination $staging -Force

      - name: Build installer (DailyTasks-Setup.exe)
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'payload'
          Set-Location $staging
          & .\build_setup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path '.\DailyTasks-Setup.exe')) { throw 'DailyTasks-Setup.exe was not produced' }

      - name: Create portable zip
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'payload'
          $portable = Join-Path $env:RUNNER_TEMP 'portable'
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          $files = @(
            'DailyTasks.cmd',
            'DailyTasks.ps1',
            'DailyTasks.exe',
            'DailyTasks.ico',
            'install.cmd',
            'uninstall.cmd',
            'uninstall.ps1',
            'README.txt',
            'setup.ps1',
            'sound.wav',
            'success.wav'
          )
          foreach ($f in $files) {
            Copy-Item -LiteralPath (Join-Path $staging $f) -Destination $portable -Force
          }
          # The packaged tasks.json is always the empty template - never user data.
          Copy-Item -LiteralPath 'DailyTasks-Setup/tasks.template.json' -Destination (Join-Path $portable 'tasks.json') -Force
          Compress-Archive -Path (Join-Path $portable '*') -DestinationPath (Join-Path $env:RUNNER_TEMP 'DailyTasks-Setup.zip') -CompressionLevel Optimal

      - name: Prepare release notes
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = "DailyTasks $tag"
          $changelog = Get-Content -LiteralPath 'CHANGELOG.md' -Raw -ErrorAction SilentlyContinue
          if ($changelog) {
            $pattern = "(?s)## \[?$([regex]::Escape($tag))\]?.*?(?=\r?\n## |\z)"
            $m = [regex]::Match($changelog, $pattern)
            if ($m.Success -and -not [string]::IsNullOrWhiteSpace($m.Value)) { $notes = $m.Value.Trim() }
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $env:RUNNER_TEMP 'release-notes.md'),
            $notes,
            (New-Object System.Text.UTF8Encoding($false))
          )

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = Join-Path $env:RUNNER_TEMP 'payload\DailyTasks-Setup.exe'
          $zip = Join-Path $env:RUNNER_TEMP 'DailyTasks-Setup.zip'
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          gh release view $tag --repo $env:GITHUB_REPOSITORY > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $exe $zip `
              --repo $env:GITHUB_REPOSITORY `
              --title "משימות יומיות $tag" `
              --notes-file $notes
          } else {
            gh release upload $tag $exe $zip --repo $env:GITHUB_REPOSITORY --clobber
          }
